spring.application.name=eod-guardian
server.port=${EOD_PORT:8080}
server.compression.enabled=true
server.servlet.session.persistent=false

# Audit persistence - H2 file database by default. For PostgreSQL set
#   SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/eodguardian  (+ username/password from your secret store)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${EOD_DATA_DIR:./data}/eodguardian;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

logging.level.com.caixa.eodguardian=INFO
